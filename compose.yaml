services:

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: web-server
    ports:
      - "3000:3000"
    volumes:
      - ./web/public:/server/web/public

  gcs:
    build:
      context: .
      dockerfile: gcs/Dockerfile
    container_name: database-handler
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      mqtt:
        condition: service_started

  mysql:
    image: mysql:latest
    container_name: mysql-database
    environment:
      MYSQL_ROOT_PASSWORD: superSneakyPassword
      MYSQL_DATABASE: gcs_data
      TZ: Australia/Brisbane
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log

  video:
    build:
      context: .
      dockerfile: video/Dockerfile
    container_name: video-handler
    environment:
      VIDEO_SOURCE: ${VIDEO_SOURCE:-/video/test-video.mp4}
      VIDEO_PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - gcs
      - video
    restart: unless-stopped

volumes:
  mysql-data: