<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>website</title>

    <link
        rel="stylesheet"
        href="/css/index.css"
    >

</head>


<body>
<div class="page">


    <!------------------------------------------------------Navigation------------------------------------------------------>
    <nav class="navbar">

        <a class="active" href="/">
            Home
        </a>

        <a href="/history">
            Data History
        </a>

        <a href="/logs">
            Extended Logs
        </a>

        <a href="/detections">Detection History</a>
        <a href="/debug">
            Debug
        </a>

    </nav>
    <!------------------------------------------------------/Navigation----------------------------------------------------->



        <!------------------------------------------------------Dashboard------------------------------------------------------>
        <main class="dashboard">


            <!------------------------------------------------------Left_Panel------------------------------------------------------>
            <section class="left-panel">


                <!------------------------------------------------------Camera------------------------------------------------------>
                <div class="camera-container">

                    <div class="camera-header">

                        <span>
                            UAV_123ABC: Live Feed
                        </span>

                        <span
                            class="status"
                            id="connectionStatus"
                        >
                            ● OFFLINE
                        </span>

                    </div>


                    <div class="camera-feed">

                        <img
                            id="liveCamera"
                            class="camera-stream"
                            src="/video"
                            alt="Live UAV camera feed"
                        >

                    </div>

                </div>
                <!------------------------------------------------------/Camera----------------------------------------------------->



                <!------------------------------------------------------Images------------------------------------------------------>
                <div class="image-strip">

                    <button class="image-scroll">
                        ‹
                    </button>


                    <div class="detection-thumbnails" id="detectionThumbnails"></div>


                    <button class="image-scroll">
                        ›
                    </button>

                </div>
                <!------------------------------------------------------/Images----------------------------------------------------->


            </section>
            <!------------------------------------------------------/Left_Panel----------------------------------------------------->



            <!------------------------------------------------------Right_Panel------------------------------------------------------>
            <section class="right-panel">


                <!------------------------------------------------------Telemetry------------------------------------------------------>
                <div class="telemetry-panel">


                    <!------------------------------------------------------Sensor_Wheel------------------------------------------------------>
                    <div class="sensor-wheel">


                        <button
                            class="sensor-button sensor-temp active"
                            data-sensor="temp"
                        >
                            Temp.
                        </button>


                        <button
                            class="sensor-button sensor-atmp"
                            data-sensor="atmp"
                        >
                            Atm
                        </button>


                        <button
                            class="sensor-button sensor-hum"
                            data-sensor="hum"
                        >
                            Humid
                        </button>


                        <button
                            class="sensor-button sensor-lux"
                            data-sensor="lux"
                        >
                            Lux
                        </button>


                        <button
                            class="sensor-button sensor-gas"
                            data-sensor="gas"
                        >
                            Gas
                        </button>


                        <div class="sensor-centre">

                            <span
                                class="sensor-centre-name"
                                id="selectedSensorName"
                            >
                                Temp.
                            </span>

                            <span
                                class="sensor-centre-value"
                                id="selectedSensorValue"
                            >
                                --
                            </span>

                        </div>


                    </div>
                    <!------------------------------------------------------/Sensor_Wheel----------------------------------------------------->



                    <!------------------------------------------------------Sensor_Values------------------------------------------------------>
                    <div class="sensor-values">


                        <button
                            class="sensor-reading active"
                            data-sensor="temp"
                        >

                            <span class="sensor-reading-header">

                                <strong>
                                    Temperature
                                </strong>

                                <span id="temperature">
                                    --
                                </span>

                            </span>

                            <span class="sensor-bar">

                                <span
                                    class="sensor-bar-fill"
                                    id="temperatureBar"
                                ></span>

                            </span>

                        </button>


                        <button
                            class="sensor-reading"
                            data-sensor="atmp"
                        >

                            <span class="sensor-reading-header">

                                <strong>
                                    Atm Pressure
                                </strong>

                                <span id="pressure">
                                    --
                                </span>

                            </span>

                            <span class="sensor-bar">

                                <span
                                    class="sensor-bar-fill"
                                    id="pressureBar"
                                ></span>

                            </span>

                        </button>


                        <button
                            class="sensor-reading"
                            data-sensor="hum"
                        >

                            <span class="sensor-reading-header">

                                <strong>
                                    Humidity
                                </strong>

                                <span id="humidity">
                                    --
                                </span>

                            </span>

                            <span class="sensor-bar">

                                <span
                                    class="sensor-bar-fill"
                                    id="humidityBar"
                                ></span>

                            </span>

                        </button>


                        <button
                            class="sensor-reading"
                            data-sensor="lux"
                        >

                            <span class="sensor-reading-header">

                                <strong>
                                    Light Level
                                </strong>

                                <span id="light">
                                    --
                                </span>

                            </span>

                            <span class="sensor-bar">

                                <span
                                    class="sensor-bar-fill"
                                    id="lightBar"
                                ></span>

                            </span>

                        </button>


                        <button
                            class="sensor-reading gas-reading"
                            data-sensor="gas"
                        >

                            <span class="sensor-reading-header">

                                <strong>
                                    Gas Concentration
                                </strong>

                            </span>

                            <span class="gas-values">
                                <span>CO <strong id="gasCO">--</strong></span>
                                <span>NO₂ <strong id="gasNO2">--</strong></span>
                                <span>NH₃ <strong id="gasNH3">--</strong></span>
                            </span>

                        </button>


                    </div>
                    <!------------------------------------------------------/Sensor_Values----------------------------------------------------->


                </div>
                <!------------------------------------------------------/Telemetry----------------------------------------------------->



                <!------------------------------------------------------Graph------------------------------------------------------>
                <div class="graph-panel">

                    <div class="graph-header">

                        <span id="graphTitle">
                            Temperature
                        </span>

                        <span id="graphUnit">
                            °C
                        </span>

                    </div>


                    <div class="graph-container">

                        <canvas id="telemetryGraph">

                        </canvas>

                    </div>

                </div>


                <div class="graph-controls">

                    <button
                        class="range-button active"
                        data-time="10"
                        data-unit="SECOND"
                    >
                        10s
                    </button>

                    <button
                        class="range-button"
                        data-time="1"
                        data-unit="MINUTE"
                    >
                        1m
                    </button>

                    <button
                        class="range-button"
                        data-time="5"
                        data-unit="MINUTE"
                    >
                        5m
                    </button>

                    <button
                        class="range-button"
                        data-time="30"
                        data-unit="MINUTE"
                    >
                        30m
                    </button>

                </div>
                <!------------------------------------------------------/Graph----------------------------------------------------->



                <!------------------------------------------------------Logs------------------------------------------------------>
                <div
                    class="log-panel"
                    id="logPanel"
                >

                    <div class="log-entry">
                        Waiting for GCS log data...
                    </div>

                </div>
                <!------------------------------------------------------/Logs----------------------------------------------------->


            </section>
            <!------------------------------------------------------/Right_Panel----------------------------------------------------->


        </main>
        <!------------------------------------------------------/Dashboard----------------------------------------------------->


    </div>

    
<div class="detection-modal" id="detectionModal">
    <div class="detection-modal-card">
        <button class="detection-modal-close" id="detectionModalClose">×</button>
        <img id="detectionModalImage" alt="Detection image">
        <h3 id="detectionModalType"></h3>
        <p id="detectionModalDescription"></p>
        <span id="detectionModalTime"></span>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/index.js"></script>
</body>

</html>
