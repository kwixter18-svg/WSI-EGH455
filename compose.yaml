services:

  web:
    image: kwixter/egh355-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: web-server
    environment:
      TZ: Australia/Brisbane
    ports:
      - "3000:3000"
    volumes:
      - ./web/public:/server/web/public

  gcs:
    image: kwixter/egh355-gcs:latest
    build:
      context: .
      dockerfile: gcs/Dockerfile
    container_name: database-handler
    environment:
      TZ: Australia/Brisbane
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      mqtt:
        condition: service_started

  mysql:
    image: mysql:latest
    container_name: mysql-database
    environment:
      MYSQL_ROOT_PASSWORD: superSneakyPassword
      MYSQL_DATABASE: gcs_data
      TZ: Australia/Brisbane
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    environment:
      TZ: Australia/Brisbane
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    environment:
      TZ: Australia/Brisbane
      VIDEO_HOST: ${VIDEO_HOST}
      VIDEO_PORT: ${VIDEO_PORT}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .template
      NGINX_ENVSUBST_FILTER: "^(VIDEO_HOST|VIDEO_PORT)$"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      - web
      - gcs
    restart: unless-stopped

volumes:
  mysql-data: