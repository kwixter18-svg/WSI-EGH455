<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extended Logs</title>
    <link rel="stylesheet" href="/css/history.css">
</head>
<body>
<div class="page">
    <!------------------------------------------------------Navigation------------------------------------------------------>
    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/history">Data History</a>
        <a class="active" href="/logs">Extended Logs</a>
        <a href="/detections">Detection History</a>
        <a href="/debug">Debug</a>
    </nav>
    <!------------------------------------------------------/Navigation----------------------------------------------------->

    <!------------------------------------------------------Header------------------------------------------------------>
    <header class="history-header">
        <div>
            <h1>Extended Logs</h1>
            <p>Complete operation log history</p>
        </div>
        <div class="entry-count" id="entryCount">Loading...</div>
    </header>
    <!------------------------------------------------------/Header----------------------------------------------------->

    <!------------------------------------------------------Content------------------------------------------------------>
    <main class="history-content">
        <div class="list-header log-header">
            <span>ID</span>
            <span>Action</span>
            <span>Description</span>
            <span>Timestamp</span>
        </div>
        <div class="entry-list" id="logList">
            <div class="empty-message">Loading logs...</div>
        </div>
    </main>
    <!------------------------------------------------------/Content----------------------------------------------------->
</div>
<script src="/js/logs.js"></script>
</body>
</html>
